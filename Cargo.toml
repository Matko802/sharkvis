[package]
name = "sharkvis"
version = "3.0.1"
edition = "2021"
description = "Terminal audio spectrum analyzer"
license = "MIT"

[dependencies]
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1"
rustfft = "6.4.1"
unifont = "1.1.0"

[profile.release]
opt-level = 3
lto = true
