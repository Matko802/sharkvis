name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            cc: gcc
            asset: sharkvis-linux-x86_64.tar.gz
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
            asset: sharkvis-linux-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y gcc make gcc-aarch64-linux-gnu python3
          else
            sudo apt-get install -y gcc make python3
          fi
      - name: build
        run: make -j$(nproc) CC=${{ matrix.cc }}
      - name: package
        run: |
          cp build/sharkvis sharkvis
          tar -czf ${{ matrix.asset }} sharkvis
          rm sharkvis
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
